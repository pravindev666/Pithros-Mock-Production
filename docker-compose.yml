# Pithros — base stack.
#
# Local development usually needs only the infrastructure:
#     docker compose up -d postgres redis minio minio-init
# and then runs backend (uvicorn) and frontend (vite) natively for hot reload.
#
# To run everything in containers, omit the service list:
#     docker compose up -d
# Production overlays this file with docker-compose.prod.yml.

name: pithros

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pithros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pithros}
      POSTGRES_DB: ${POSTGRES_DB:-pithros}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pithros} -d ${POSTGRES_DB:-pithros}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Mirrors the three-bucket layout R2 uses in production.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set pithros http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} >/dev/null;
      mc mb --ignore-existing pithros/pithros-public;
      mc mb --ignore-existing pithros/pithros-private;
      mc mb --ignore-existing pithros/pithros-sensitive;
      mc anonymous set download pithros/pithros-public;
      echo 'Buckets ready.';
      exit 0;
      "

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.development
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pithros}:${POSTGRES_PASSWORD:-pithros}@postgres:5432/${POSTGRES_DB:-pithros}
      REDIS_URL: redis://redis:6379/0
      R2_ENDPOINT_URL: http://minio:9000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - ./backend/.env.development
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pithros}:${POSTGRES_PASSWORD:-pithros}@postgres:5432/${POSTGRES_DB:-pithros}
      REDIS_URL: redis://redis:6379/0
      R2_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - ./backend/.env.development
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pithros}:${POSTGRES_PASSWORD:-pithros}@postgres:5432/${POSTGRES_DB:-pithros}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./Pithros
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:
