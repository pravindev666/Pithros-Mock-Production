name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, types, tests, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pithros
          POSTGRES_PASSWORD: pithros
          POSTGRES_DB: pithros_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pithros"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://pithros:pithros@localhost:5432/pithros_test
      TEST_DATABASE_URL: postgresql+psycopg://pithros:pithros@localhost:5432/pithros_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      DEMO_MODE: "false"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libpq-dev
      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff (lint)
        working-directory: backend
        run: ruff check .
      - name: Ruff (format)
        working-directory: backend
        run: ruff format --check .
      - name: Mypy
        working-directory: backend
        run: mypy app
      - name: Migration drift check
        working-directory: backend
        run: |
          python -c "import psycopg; c=psycopg.connect('host=localhost port=5432 user=pithros password=pithros dbname=pithros_test'); c.autocommit=True; c.execute('DROP DATABASE IF EXISTS pithros_ci_migrate'); c.execute('CREATE DATABASE pithros_ci_migrate')"
          DATABASE_URL=postgresql+psycopg://pithros:pithros@localhost:5432/pithros_ci_migrate alembic upgrade head
          DATABASE_URL=postgresql+psycopg://pithros:pithros@localhost:5432/pithros_ci_migrate alembic check
      - name: Tests (unit + integration; excludes e2e)
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (types, guard, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pithros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Pithros/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Live-mode guard
        run: npm run check:live
      - name: Build
        run: npm run build
