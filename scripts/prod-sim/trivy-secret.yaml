allow-rules:
  - id: firebase-service-account-template
    description: >-
      app/auth/firebase.py builds the Firebase service-account dict from
      environment variables at runtime (settings.firebase_*). The built-in
      GCP-service-account rule matches the *shape* of that template, not a
      credential value: no key material is present in the file. Allow this one
      path only; every other file and every other secret rule stays enabled.
    path: app/auth/firebase\.py$
